<!DOCTYPE html>
<html lang="ru">
<head>

<title>ОГЭ Информатика — Задание 2. Кодирование и декодирование информации</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f5f5f7;
  --bg-card: #ffffff;
  --text: #1d1d1f;
  --text-soft: #515154;
  --text-muted: #86868b;
  --border: #d2d2d7;
  --border-soft: #e8e8ed;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: #e8f4fd;
  --success: #34c759;
  --success-soft: #eafaf1;
  --error: #ff3b30;
  --error-soft: #fff0ef;
  --warning: #ff9500;
  --warning-soft: #fff8eb;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 4px 12px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  color: var(--text);
  background: var(--bg-soft);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body { padding: 16px; }

.container { max-width: 1000px; margin: 0 auto; }

.header {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
}

.header-title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.header-sub { color: var(--text-soft); font-size: 15px; }

.header-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-muted);
}

.header-meta span { display: flex; align-items: center; gap: 6px; }

.tabs {
  display: flex;
  gap: 8px;
  background: var(--bg-card);
  padding: 8px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
  overflow-x: auto;
}

.tab {
  flex: 1;
  min-width: 140px;
  padding: 12px 16px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}

.tab:hover { background: var(--bg-soft); color: var(--text); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab.active { background: var(--accent); color: white; box-shadow: var(--shadow-sm); }

.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 26px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
}

.card-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

h3 { font-size: 17px; font-weight: 600; margin: 20px 0 10px; color: var(--text); }
p { margin-bottom: 12px; color: var(--text-soft); }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 10px 0 14px 24px; color: var(--text-soft); }
li { margin-bottom: 6px; }
strong { color: var(--text); font-weight: 600; }

.note {
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 10px;
  margin: 16px 0;
  font-size: 14px;
  color: var(--text);
}
.note-warn { background: var(--warning-soft); border-left-color: var(--warning); }
.note-success { background: var(--success-soft); border-left-color: var(--success); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 44px;
  min-width: 44px;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border-soft); }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.task {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow-sm);
}

.task-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}

.task-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 4px 12px;
  border-radius: 20px;
}

.task-link {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 8px;
  border-radius: 6px;
}
.task-link:hover { color: var(--accent); background: var(--accent-soft); }

.task-text {
  color: var(--text);
  font-size: 15px;
  margin-bottom: 14px;
  line-height: 1.65;
}

.code-table {
  width: auto;
  border-collapse: collapse;
  font-size: 14px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  margin: 14px 0;
}

.code-table th, .code-table td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: center;
  min-width: 40px;
  font-weight: 500;
}

.code-table th {
  background: var(--bg-soft);
  font-weight: 700;
  color: var(--text);
}

.code-table td {
  background: #ffffff;
  color: var(--text);
}

.morse-text {
  font-family: "Consolas", "Monaco", monospace;
  font-size: 16px;
  letter-spacing: 2px;
  background: var(--bg-soft);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  display: inline-block;
  margin: 10px 0;
  border: 1px solid var(--border-soft);
}

.input-group { margin-top: 14px; }

.input-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-soft);
  margin-bottom: 6px;
}

.input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  background: var(--bg-card);
  color: var(--text);
  transition: border-color 0.15s, box-shadow 0.15s;
  min-height: 44px;
}

.input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.input.correct { border-color: var(--success); background: var(--success-soft); }
.input.wrong { border-color: var(--error); background: var(--error-soft); }

.feedback {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  display: none;
}
.feedback.show { display: block; }
.feedback.success { background: var(--success-soft); color: #1b7a3d; border: 1px solid #b7ebc9; }
.feedback.error { background: var(--error-soft); color: #c41e14; border: 1px solid #f5c6c2; }

.solution {
  margin-top: 12px;
  padding: 16px 18px;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--accent);
  font-size: 14px;
  line-height: 1.7;
  display: none;
}
.solution.show { display: block; }
.solution-title { font-weight: 600; margin-bottom: 8px; color: var(--text); }

.results-panel {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  margin-top: 20px;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
  display: none;
}
.results-panel.show { display: block; }

.results-score {
  text-align: center;
  padding: 22px;
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
}
.results-score-num { font-size: 52px; font-weight: 700; color: var(--accent); line-height: 1; }
.results-score-label { font-size: 14px; color: var(--text-soft); margin-top: 6px; }

.progress-bar {
  height: 6px;
  background: var(--border-soft);
  border-radius: 3px;
  overflow: hidden;
  margin: 12px 0;
}
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

.result-item {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border: 1px solid var(--border);
  font-size: 14px;
}
.result-item.correct { background: var(--success-soft); border-color: #b7ebc9; }
.result-item.wrong { background: var(--error-soft); border-color: #f5c6c2; }

.result-item-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  flex-wrap: wrap;
  gap: 6px;
}
.result-item-num { font-weight: 600; color: var(--text); }
.result-item-status {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
}
.result-item-status.correct { background: var(--success); color: white; }
.result-item-status.wrong { background: var(--error); color: white; }

.result-item-answers { font-size: 13px; color: var(--text-soft); }
.result-item-answers strong { color: var(--text); }

.footer {
  text-align: center;
  padding: 20px;
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 20px;
}
.footer a { color: var(--accent); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-desc { font-size: 14px; color: var(--text-muted); }

.type-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.02em;
}
.type-badge.numbers { background: #1e3a8a; color: #ffffff; }
.type-badge.symbols { background: #fef3c7; color: #92400e; }
.type-badge.morse { background: #dcfce7; color: #166534; }

.solution p { margin-bottom: 8px; }
.solution p:last-child { margin-bottom: 0; }

@media (max-width: 640px) {
  .header-title { font-size: 24px; }
}
</style>
</head>

      <li>Продолжайте, пока не расшифруете всё сообщение</li>
    </ol>

    <h3>Для азбуки Морзе (Тип В)</h3>
    <ol>
      <li>Начните с первого символа (точка или тире)</li>
      <li>Найдите в таблице букву, код которой начинается с этого символа</li>
      <li>Если есть несколько вариантов — попробуйте каждый и проверьте, получается ли расшифровать остальное</li>
      <li>Запишите расшифрованное слово</li>
    </ol>

    <div class="note">
      <strong>Лайфхак:</strong> для азбуки Морзе начинайте с самых длинных кодов — они обычно однозначны.
    </div>
  `;
  app.appendChild(algo);

  const example1 = document.createElement('section');
  example1.className = 'card';
  example1.innerHTML = `
    <h2 class="card-title">Разбор примера 1 (шифр с номерами букв)</h2>
    <p><strong>Задание №37509.</strong> Ваня шифрует русские слова, записывая вместо каждой буквы ее номер в алфавите (без пробелов). Номера букв даны в таблице.</p>
    <table class="code-table">
      <tr><th>А 1</th><th>Й 11</th><th>У 21</th><th>Э 31</th></tr>
      <tr><td>Б 2</td><td>К 12</td><td>Ф 22</td><td>Ю 32</td></tr>
      <tr><td>В 3</td><td>Л 13</td><td>Х 23</td><td>Я 33</td></tr>
      <tr><td>Г 4</td><td>М 14</td><td>Ц 24</td><td></td></tr>
      <tr><td>Д 5</td><td>Н 15</td><td>Ч 25</td><td></td></tr>
      <tr><td>Е 6</td><td>О 16</td><td>Ш 26</td><td></td></tr>
      <tr><td>е 7</td><td>П 17</td><td>Щ 27</td><td></td></tr>
      <tr><td>Ж 8</td><td>Р 18</td><td>Ъ 28</td><td></td></tr>
      <tr><td>З 9</td><td>С 19</td><td>Ы 29</td><td></td></tr>
      <tr><td>И 10</td><td>Т 20</td><td>Ь 30</td><td></td></tr>
    </table>
    <p>Некоторые шифровки можно расшифровать несколькими способами. Например, 311333 может означать «ВАЛЯ», может — «ЭЛЯ», а может — «ВААВВВ».</p>
    <p>Даны четыре шифровки:</p>
    <ul>
      <li>232323</li>
      <li>654313</li>
      <li>203105</li>
      <li>203033</li>
    </ul>
    <p>Только одна из них расшифровывается единственным способом. Найдите ее и расшифруйте.</p>

    <h3>Решение</h3>
    <p>Проанализируем каждый вариант ответа.</p>
    <p><strong>1.</strong> «232323» может означать как «ХХХ» так и «БВБВБВ», и др.</p>
    <p><strong>2.</strong> «654313» может означать как «ЕДГВАВ» так и «ЕДГВЛ».</p>
    <p><strong>3.</strong> «203105» может означать только «ТВИД».</p>
    <p><strong>4.</strong> «203033» может означать как «ТЬВВ» так и «ТЬЯ».</p>
    <p>Следовательно, ответ «ТВИД».</p>
    
    <div class="note note-success">
      <strong>Ответ: ТВИД</strong>
    </div>
  `;
  app.appendChild(example1);

  const example2 = document.createElement('section');
  example2.className = 'card';
  example2.innerHTML = `
    <h2 class="card-title">Разбор примера 2 (шифр с символьными кодами)</h2>
    <p><strong>Задание №187.</strong> Вася и Петя играли в шпионов и кодировали сообщения собственным шифром. Фрагмент кодовой таблицы приведен ниже:</p>
    <table class="code-table">
      <tr><th>Ж</th><th>Е</th><th>С</th><th>А</th><th>К</th><th>Л</th></tr>
      <tr><td>+#</td><td>+^#</td><td>#</td><td>^</td><td>^#</td><td>#+</td></tr>
    </table>
    <p>Расшифруйте сообщение, если известно, что буквы в нем не повторяются:</p>
    <div class="morse-text">#++^##^#^</div>
    <p>Запишите в ответе расшифрованное сообщение.</p>

    <h3>Решение</h3>
    <p>Сопоставляя символы их кодам, расшифруем сообщение:</p>
    <p># → Л</p>
    <p>+^ → Е</p>
    <p># → С</p>
    <p>^ → А</p>
    <p>#^ → К</p>
    <p>Получаем: #++^##^#^ = ЛЕСКА.</p>
    
    <div class="note note-success">
      <strong>Ответ: ЛЕСКА</strong>
    </div>
  `;
  app.appendChild(example2);

  const mistakes = document.createElement('section');
  mistakes.className = 'card';
  mistakes.innerHTML = `
    <h2 class="card-title">Типичные ошибки</h2>
    <ul>
      <li>❌ Не проверять все варианты расшифровки — всегда ищите альтернативные разбиения</li>
      <li>❌ Забывать, что в шифрах с номерами букв числа могут быть однозначными (1-9) и двузначными (10-33)</li>
      <li>❌ В азбуке Морзе начинать с коротких кодов вместо длинных</li>
      <li>❌ Писать ответ с пробелами или знаками препинания, когда просят без них</li>
      <li>❌ Не учитывать условие «буквы не повторяются» в некоторых заданиях</li>
    </ul>
    <div class="note">
      <strong>Совет:</strong> всегда записывайте все возможные варианты расшифровки и сравнивайте их.
    </div>
  `;
  app.appendChild(mistakes);
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">⚡ Практика 1</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);

  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);

  TASKS.slice(2, 12).forEach((task, idx) => {
    const taskEl = createTaskElement(task, idx + 1, 'practice1');
    tasksBlock.appendChild(taskEl);
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">📝 Практика 2</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);

  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);

  TASKS.slice(12, 22).forEach((task, idx) => {
    const taskEl = createTaskElement(task, idx + 1, 'practice2');
    tasksBlock.appendChild(taskEl);
  });

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);

  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';

  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.innerHTML = 'Задание ' + num + ' №' + task.num + getTypeBadge(task.type);
  header.appendChild(numEl);

  const linkEl = document.createElement('a');
  linkEl.className = 'task-link';
  linkEl.href = 'https://inf-oge.sdamgia.ru/problem?id=' + task.num;
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  linkEl.textContent = 'Оригинал ↗';
  header.appendChild(linkEl);

  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.innerHTML = task.text.replace(/\n/g, '<br>');
  taskEl.appendChild(textEl);

  if (task.text1) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.innerHTML = task.text1.replace(/\n/g, '<br>');
    taskEl.appendChild(t);
  }
  
  if (task.table) {
    const table = document.createElement('table');
    table.className = 'code-table';
    
    task.table.forEach((row, i) => {
      const tr = document.createElement('tr');
      row.forEach((cell) => {
        // Если стоит флаг noHeader, ВСЕ ячейки будут <td>, иначе первая строка будет <th>
        const cellTag = (i === 0 && !task.noHeader) ? 'th' : 'td';
        const td = document.createElement(cellTag);
        td.textContent = cell;
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    taskEl.appendChild(table);
  }
  
  if (task.text2) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.innerHTML = task.text2.replace(/\n/g, '<br>');
    taskEl.appendChild(t);
  }
 
  if (task.text3) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.innerHTML = task.text3.replace(/\n/g, '<br>');
    taskEl.appendChild(t);
  }

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';

  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ:';
  inputGroup.appendChild(label);

  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'characters');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Введите ответ';
  input.addEventListener('input', (e) => {
    updateAnswer(mode, task.id, e.target.value);
  });
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);

    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }

  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);

  const solParagraphs = task.solution.split('\n\n');
  solParagraphs.forEach(para => {
    const p = document.createElement('p');
    p.textContent = para.trim();
    solution.appendChild(p);
  });

  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  taskEl.appendChild(solution);

  return taskEl;
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.checked1[taskId] = false;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;

  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;

  const userAnswer = (state.answers1[taskId] || '').trim();

  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }

  state.checked1[taskId] = true;

  if (userAnswer.toUpperCase() === task.answer.toUpperCase()) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) {
    sol.classList.toggle('show', state.showSolution1[taskId]);
  }
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;

  TASKS.slice(12, 22).forEach((task, idx) => {
    const num = idx + 1;
    const userAnswer = (state.answers2[task.id] || '').trim();
    const isCorrect = userAnswer.toUpperCase() === task.answer.toUpperCase();
    if (isCorrect) correct++;
    results.push({
      num: num,
      task: task,
      userAnswer: userAnswer || '—',
      correctAnswer: task.answer,
      isCorrect: isCorrect
    });
  });

  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;

  panel.innerHTML = '';
  panel.classList.add('show');

  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);

  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);

  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');

    const head = document.createElement('div');
    head.className = 'result-item-head';

    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);

    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);

    item.appendChild(head);

    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.correctAnswer);
    item.appendChild(answers);

    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.style.cssText = 'margin-top:10px;font-size:13px;color:var(--text-soft);line-height:1.6;';
      const solParagraphs = r.task.solution.split('\n\n');
      solParagraphs.forEach(para => {
        const p = document.createElement('p');
        p.textContent = para.trim();
        p.style.marginBottom = '6px';
        sol.appendChild(p);
      });
      item.appendChild(sol);
    }

    panel.appendChild(item);
  });

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;

  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  renderTheory();
}

init();
</script>
